[project]
name = "studylab-manim"
version = "0.1.0"
description = "Shared Manim Community setup for study-lab explanation videos."
requires-python = ">=3.12,<3.13"
dependencies = [
    "manim==0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studylab_manim"]
